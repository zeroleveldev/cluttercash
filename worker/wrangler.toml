BETA_WEEKLY_REQUEST_LIMIT = "3"
BETA_ANONYMOUS_DAILY_BUDGET_MICRO_USD = "393216"
BETA_ANONYMOUS_NETWORK_DAILY_LIMIT = "6"
BETA_DAILY_BUDGET_MICRO_USD = "500000"
OPENAI_MAX_REQUEST_COST_MICRO_USD = "131072"
STRIPE_BILLING_MODE = "test"
STRIPE_PRODUCT_ID = "prod_VGUZYKCpV9CZ9k"
STRIPE_PRICE_ID = "price_1IFxabA4yXUYRWwmCwOHLBC5"
STRIPE_PORTAL_CONFIGURATION_ID = "bpc_1UGHLdA4yXUYRWwmgxrN7k3a"
SUBSCRIBER_APP_ORIGIN = "https://cluttercash.app"
